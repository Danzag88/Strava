name: Daily Strava backup

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      reseed_token:
        description: Overwrite the Snowflake refresh token from the GitHub secret
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: strava-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Back up Strava into Snowflake
        env:
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          STRAVA_GRANTED_SCOPE: ${{ secrets.STRAVA_GRANTED_SCOPE }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_PRIVATE_KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64 }}
          RESEED_TOKEN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.reseed_token == 'true' && 'true' || 'false' }}
        run: python -m strava_backup

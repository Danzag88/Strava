[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strava-backup"
version = "0.1.0"
description = "Daily Strava backup into Snowflake"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.0",
  "snowflake-connector-python>=3.12.0",
]

[project.scripts]
strava-backup = "strava_backup.pipeline:main"
strava-bootstrap = "strava_backup.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]
